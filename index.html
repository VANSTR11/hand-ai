<!DOCTYPE html>
<html>
<head>
    <title>Hand + Face Scanner AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; color: #0ff; font-family: 'Courier New', monospace; overflow: hidden; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); }
.ui { position: absolute; top: 20px; left: 20px; z-index: 10; font-size: 20px; text-shadow: 0 0 10px #0ff; }
.scan-box { position: absolute; border: 3px solid #0ff; box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff; z-index: 5; display: none; }
.face-box { position: absolute; border: 3px solid #0f0; box-shadow: 0 0 20px #0f0, inset 0 0 20px #0f0; z-index: 5; display: none; }
.scan-text { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); color: #0ff; font-size: 18px; font-weight: bold; }
.face-text { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); color: #0f0; font-size: 16px; font-weight: bold; }
.corner { position: absolute; width: 20px; height: 20px; border: 3px solid #0ff; }
.face-corner { border-color: #0f0; }
.tl { top: -3px; left: -3px; border-right: none; border-bottom: none; }
.tr { top: -3px; right: -3px; border-left: none; border-bottom: none; }
.bl { bottom: -3px; left: -3px; border-right: none; border-top: none; }
.br { bottom: -3px; right: -3px; border-left: none; border-top: none; }
.glitch { animation: glitch 0.3s linear infinite; }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        #status { position: absolute; bottom: 20px; left: 20px; font-size: 16px; color: #0f0; }
        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 24px; background: #0ff; color: #000;
            border: none; border-radius: 10px; z-index: 20; cursor: pointer;
            box-shadow: 0 0 20px #0ff;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
</head>
<body>
    <button id="startBtn">TAP TO START</button>
    <video id="video"></video>
    <canvas id="canvas"></canvas>
    <div class="ui">[SYSTEM] BIOMETRIC SCANNER v3.2</div>
    <div id="scanBox" class="scan-box">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div id="scanText" class="scan-text">SCANNING...</div>
    </div>
    <div id="faceBox" class="face-box">
        <div class="corner face-corner tl"></div><div class="corner face-corner tr"></div>
        <div class="corner face-corner bl"></div><div class="corner face-corner br"></div>
        <div id="faceText" class="face-text">FACE DETECTED</div>
    </div>
    <div id="status">Tap button to activate camera</div>

    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scanBox = document.getElementById('scanBox');
        const scanText = document.getElementById('scanText');
        const faceBox = document.getElementById('faceBox');
        const faceText = document.getElementById('faceText');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        let scanComplete = false;
        let lastGesture = '';
        let scanTimeout;
        let hands, faceDetection;
        let running = false;

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function isPeaceSign(landmarks) {
            const tipIds = [4, 8, 12, 16, 20];
            const fingers = [];
            fingers.push(landmarks[4].x > landmarks[3].x);
            for (let i = 1; i < 5; i++) {
                fingers.push(landmarks[tipIds[i]].y < landmarks[tipIds[i] - 2].y);
            }
            return fingers[1] && fingers[2] &&!fingers[3] &&!fingers[4];
        }

        function isThumbsUp(landmarks) {
            return landmarks[4].y < landmarks[3].y && landmarks[8].y > landmarks[6].y;
        }

        function isThumbsDown(landmarks) {
            return landmarks[4].y > landmarks[3].y && landmarks[8].y > landmarks[6].y;
        }

        function isOpenPalm(landmarks) {
            const tipIds = [8, 12, 16, 20];
            let openFingers = 0;
            for (let i = 0; i < 4; i++) {
                if (landmarks[tipIds[i]].y < landmarks[tipIds[i] - 2].y) openFingers++;
            }
            return openFingers >= 4;
        }

        async function processFrame() {
            if (!running) return;
            await hands.send({image: video});
            await faceDetection.send({image: video});
            requestAnimationFrame(processFrame);
        }

        hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00FFFF', lineWidth: 2});
                drawLandmarks(ctx, landmarks, {color: '#FFFFFF', lineWidth: 1, radius: 3});

                let minX = 1, minY = 1, maxX = 0, maxY = 0;
                for (const lm of landmarks) {
                    minX = Math.min(minX, lm.x);
                    minY = Math.min(minY, lm.y);
                    maxX = Math.max(maxX, lm.x);
                    maxY = Math.max(maxY, lm.y);
                }

                // FIX KOORDINAT MIRROR - INI KUNCINYA BIAR KOTAK GAK MELAYANG
                const padding = 0.05;
                const boxWidth = (maxX - minX + padding*2) * canvas.width;
                const boxHeight = (maxY - minY + padding*2) * canvas.height;
                const boxLeft = (1 - maxX - padding) * canvas.width; // FLIP X KARENA VIDEO DI-MIRROR
                const boxTop = (minY - padding) * canvas.height;

                scanBox.style.display = 'block';
                scanBox.style.left = boxLeft + 'px';
                scanBox.style.top = boxTop + 'px';
                scanBox.style.width = boxWidth + 'px';
                scanBox.style.height = boxHeight + 'px';

                if (!scanComplete) {
                    scanBox.classList.add('glitch');
                    scanText.innerText = `SCANNING...`;
                    if (!scanTimeout) {
                        scanTimeout = setTimeout(() => {
                            scanComplete = true;
                            scanText.innerText = `SCAN COMPLETE`;
                            setTimeout(() => scanBox.classList.remove('glitch'), 500);
                            checkGesture(landmarks);
                        }, 1500);
                    }
                } else {
                    checkGesture(landmarks);
                }
                statusEl.innerText = "Show ✌️ to open TikTok";
            } else {
                scanBox.style.display = 'none';
                if (scanTimeout) {
                    clearTimeout(scanTimeout);
                    scanTimeout = null;
                }
                scanComplete = false;
                statusEl.innerText = "Hand not detected";
            }
        });

        faceDetection = new FaceDetection({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`});
        faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
        faceDetection.onResults((results) => {
            if (results.detections && results.detections.length > 0) {
                const detection = results.detections[0].boundingBox;
                // FIX KOORDINAT MIRROR UNTUK MUKA JUGA
                const boxWidth = detection.width * canvas.width;
                const boxHeight = detection.height * canvas.height;
                const boxLeft = (1 - detection.xCenter - detection.width/2) * canvas.width; // FLIP X
                const boxTop = (detection.yCenter - detection.height/2) * canvas.height;

                faceBox.style.display = 'block';
                faceBox.style.left = boxLeft + 'px';
                faceBox.style.top = boxTop + 'px';
                faceBox.style.width = boxWidth + 'px';
                faceBox.style.height = boxHeight + 'px';
                faceText.innerText = `FACE DETECTED`;
            } else {
                faceBox.style.display = 'none';
            }
        });

        function checkGesture(landmarks) {
            if (!scanComplete || lastGesture) return;

            if (isPeaceSign(landmarks)) {
                lastGesture = 'tiktok';
                statusEl.innerText = "[ACCESS GRANTED] Opening TikTok...";
                speak("Correct. Access granted. Opening TikTok");
                setTimeout(() => {
                    location.href = 'https://www.tiktok.com/';
                }, 2000);
                setTimeout(() => { lastGesture = ''; }, 5000);
            } else if (isThumbsUp(landmarks) || isThumbsDown(landmarks) || isOpenPalm(landmarks)) {
                lastGesture = 'wrong';
                statusEl.innerText = "[ACCESS DENIED] Wrong gesture";
                speak("Wrong gesture. Access denied");
                setTimeout(() => { lastGesture = ''; }, 3000);
            }
        }

        startBtn.onclick = async () => {
            speak("System activated. Starting biometric scan");
            startBtn.style.display = 'none';
            statusEl.innerText = "Activating camera...";
            running = true;

            const camera = new Camera(video, {
                onFrame: async () => {},
                width: 640,
                height: 480
            });
            await camera.start();
            processFrame();
            statusEl.innerText = "Show your hand to camera";
        };
    </script>
</body>
</html>
