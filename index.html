<!DOCTYPE html>
<html>
<head>
    <title>Hand Scanner AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; color: #0ff; font-family: 'Courier New', monospace; overflow: hidden; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); }
    .ui { position: absolute; top: 20px; left: 20px; z-index: 10; font-size: 20px; text-shadow: 0 0 10px #0ff; }
    .scan-box { position: absolute; border: 3px solid #0ff; box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff; z-index: 5; display: none; }
    .scan-text { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); color: #0ff; font-size: 18px; font-weight: bold; }
    .corner { position: absolute; width: 20px; height: 20px; border: 3px solid #0ff; }
    .tl { top: -3px; left: -3px; border-right: none; border-bottom: none; }
    .tr { top: -3px; right: -3px; border-left: none; border-bottom: none; }
    .bl { bottom: -3px; left: -3px; border-right: none; border-top: none; }
    .br { bottom: -3px; right: -3px; border-left: none; border-top: none; }
    .glitch { animation: glitch 0.3s linear infinite; }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        #status { position: absolute; bottom: 20px; left: 20px; font-size: 16px; color: #0f0; }
        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 24px; background: #0ff; color: #000;
            border: none; border-radius: 10px; z-index: 20; cursor: pointer;
            box-shadow: 0 0 20px #0ff;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <button id="startBtn">TAP UNTUK MULAI</button>
    <video id="video"></video>
    <canvas id="canvas"></canvas>
    <div class="ui">[SYSTEM] HAND SCANNER v2.0</div>
    <div id="scanBox" class="scan-box">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div id="scanText" class="scan-text">SCANNING... 0%</div>
    </div>
    <div id="status">Klik tombol untuk aktifkan kamera</div>

    <!-- EFEK SUARA -->
    <audio id="beepSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b2d3b1b7c.mp3?filename=beep-6-96243.mp3" preload="auto"></audio>
    <audio id="glitchSound" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8a8e1e4b1.mp3?filename=glitch-sound-effect-120058.mp3" preload="auto"></audio>
    <audio id="accessSound" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1ca4a.mp3?filename=success-1-6297.mp3" preload="auto"></audio>

    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scanBox = document.getElementById('scanBox');
        const scanText = document.getElementById('scanText');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        // Sound
        const beepSound = document.getElementById('beepSound');
        const glitchSound = document.getElementById('glitchSound');
        const accessSound = document.getElementById('accessSound');
        beepSound.volume = 1.0;
        glitchSound.volume = 1.0;
        accessSound.volume = 1.0;

        let scanProgress = 0;
        let lastGesture = '';
        let scanInterval;
        let camera;
        let gestureReady = false;

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio blocked:", e));
        }

        function isPeaceSign(landmarks) {
            const tipIds = [4, 8, 12, 16, 20];
            const fingers = [];
            fingers.push(landmarks[4].x > landmarks[3].x);
            for (let i = 1; i < 5; i++) {
                fingers.push(landmarks[tipIds[i]].y < landmarks[tipIds[i] - 2].y);
            }
            return fingers[1] && fingers[2] &&!fingers[3] &&!fingers[4];
        }

        function onResults(results) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00FFFF', lineWidth: 2});
                drawLandmarks(ctx, landmarks, {color: '#FFFFFF', lineWidth: 1, radius: 3});

                let minX = 1, minY = 1, maxX = 0, maxY = 0;
                for (const lm of landmarks) {
                    minX = Math.min(minX, lm.x);
                    minY = Math.min(minY, lm.y);
                    maxX = Math.max(maxX, lm.x);
                    maxY = Math.max(maxY, lm.y);
                }

                const padding = 0.05;
                scanBox.style.display = 'block';
                scanBox.style.left = (minX - padding) * canvas.width + 'px';
                scanBox.style.top = (minY - padding) * canvas.height + 'px';
                scanBox.style.width = (maxX - minX + padding*2) * canvas.width + 'px';
                scanBox.style.height = (maxY - minY + padding*2) * canvas.height + 'px';

                if (!scanInterval) {
                    scanProgress = 0;
                    gestureReady = false;
                    scanBox.classList.add('glitch');
                    playSound(beepSound);
                    scanInterval = setInterval(() => {
                        scanProgress += Math.random() * 15;
                        playSound(beepSound); // Bunyi tiap % naik
                        if (scanProgress >= 100) {
                            scanProgress = 100;
                            clearInterval(scanInterval);
                            scanInterval = null;
                            scanText.innerText = `SCAN COMPLETE`;
                            gestureReady = true;
                            playSound(glitchSound); // Bunyi glitch pas complete
                            setTimeout(() => scanBox.classList.remove('glitch'), 500);
                            checkGesture(landmarks);
                        } else {
                            scanText.innerText = `SCANNING... ${Math.floor(scanProgress)}%`;
                        }
                    }, 100);
                } else if (gestureReady) {
                    checkGesture(landmarks);
                }
            } else {
                scanBox.style.display = 'none';
                if (scanInterval) {
                    clearInterval(scanInterval);
                    scanInterval = null;
                }
                statusEl.innerText = "Tangan tidak terdeteksi";
            }
        }

        function checkGesture(landmarks) {
            if (!gestureReady || lastGesture === 'tiktok') return;

            if (isPeaceSign(landmarks)) {
                lastGesture = 'tiktok';
                statusEl.innerText = "[ACCESS GRANTED] Membuka TikTok...";
                playSound(accessSound); // Bunyi sukses
                setTimeout(() => {
                    location.href = 'https://www.tiktok.com/';
                }, 500); // Delay dikit biar suaranya kedengeran
                setTimeout(() => { lastGesture = ''; }, 4000);
            }
        }

        startBtn.onclick = async () => {
            startBtn.style.display = 'none';
            statusEl.innerText = "Mengaktifkan kamera...";
            playSound(accessSound); // Bunyi pas start

            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
            hands.onResults(onResults);

            camera = new Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: 1280, height: 720 });
            await camera.start();
            statusEl.innerText = "Acungkan ✌️ untuk buka TikTok";
        };
    </script>
</body>
</html>
