<!DOCTYPE html>
<html>
<head>
    <title>Hand Gesture AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); }
      .ui { position: absolute; top: 20px; left: 20px; z-index: 10; font-size: 24px; text-shadow: 0 0 10px #0f0; }
      .glitch { animation: glitch 1s linear infinite; }
        @keyframes glitch {
            2%,64% { transform: translate(2px,0) skew(0deg); }
            4%,60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }
        #status { position: absolute; bottom: 20px; left: 20px; font-size: 18px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <video id="video"></video>
    <canvas id="canvas"></canvas>
    <div class="ui glitch">LOADING AI...</div>
    <div id="status">Arahkan tangan ke kamera</div>

    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const ui = document.querySelector('.ui');
        
        let lastGesture = '';
        let gestureTimeout;

        function onResults(results) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks) {
                ui.innerText = "AI ACTIVE";
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
                    drawLandmarks(ctx, landmarks, {color: '#FF0000', lineWidth: 1});
                    
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    const middleTip = landmarks[12];
                    const wrist = landmarks[0];

                    // Jempol ke Atas = Buka WhatsApp
                    if (thumbTip.y < indexTip.y && lastGesture!== 'wa') {
                        lastGesture = 'wa';
                        statusEl.innerText = "AI Trigger: Membuka WhatsApp...";
                        window.open('https://wa.me/', '_blank');
                        clearTimeout(gestureTimeout);
                        gestureTimeout = setTimeout(() => { lastGesture = ''; statusEl.innerText = "Arahkan tangan ke kamera"; }, 3000);
                    }
                    
                    // Telapak Tangan = Buka Instagram 
                    if (middleTip.y < wrist.y && Math.abs(thumbTip.x - indexTip.x) > 0.1 && lastGesture!== 'ig') {
                        lastGesture = 'ig';
                        statusEl.innerText = "AI Trigger: Membuka Instagram...";
                        window.open('https://instagram.com', '_blank');
                        clearTimeout(gestureTimeout);
                        gestureTimeout = setTimeout(() => { lastGesture = ''; statusEl.innerText = "Arahkan tangan ke kamera"; }, 3000);
                    }
                }
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onResults);

        const camera = new Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: 1280, height: 720 });
        camera.start();
    </script>
</body>
</html>
